[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-transmute"
version = "0.1.0"
description = "AI-powered code transpilation engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sean Cheong"}
]
keywords = ["transpilation", "code-generation", "ai", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.20",
    "pathspec>=0.11",
    "tqdm>=4.65",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
repo-transmute = "repo_transmute.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Custom mark for tests that call the real LLM API (MiniMax or z.ai).
# These tests require MINIMAX_API_KEY or ZAI_API_KEY to be set and are
# skipped by default. Run them explicitly with:
#   pytest -v -k "real_llm"
# Or to include them in the default run (will skip gracefully if no key):
#   pytest -v -m "real_llm or not real_llm"
markers = [
    "real_llm: tests that call the real MiniMax or z.ai API (require API key)",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
